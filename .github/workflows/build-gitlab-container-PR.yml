name: 'Build CI container (PR)'

on:
  merge_group:
    # We can't limit the files as below as this is a required check so should run
    # We exit early in case no relevant file changed
    types: [checks_requested]
  pull_request:
    branches:
      - main
  push:

jobs:
  changes:
    name: Detect changed files
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read
  pr-gitlab:
    name: PR CI image
    needs: changes
    # Skip only when change detection ran and said so: a skipped job counts
    # as a passed required check, so if detection failed we must run.
    if: ${{ !cancelled() && needs.changes.outputs.cicontainer != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use the same PHP config as the contributor containers
        run: cp -r docker-{contributor,gitlabci}/php-config

      - name: Log in to GitHub Container registry (possibly at fork)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Building an example chroot
        run: docker-gitlabci/build_ci_chroot.sh

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: "./docker-gitlabci" 
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
